<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAVE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23192855' stroke='%23FEF8DE' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #192855;
    --navy-deep: #111c3e;
    --navy-1: #2e3f73;
    --navy-2: #3b4c82;
    --cream: #fef8de;
    --cream-mid: #f3e7b8;
    --pearl: #f1f1f1;
    --muted: rgba(254, 248, 222, .62);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--cream);
    font-family: 'Nunito', 'Noto Sans KR', system-ui, sans-serif; font-weight: 800; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120vw 110vh at 50% 45%, transparent 55%, rgba(17, 28, 62, .85) 100%); }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: 2.6vh 3vw 0; z-index: 3; pointer-events: none; }
  .brand { font-weight: 900; font-size: clamp(18px, 3.2vh, 44px); letter-spacing: .32em; margin-bottom: 1.2vh; color: var(--cream); }
  .titles { position: relative; height: 9vh; min-width: 50vw; }
  .title { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 900; letter-spacing: -.025em; color: var(--cream);
    font-size: clamp(28px, 5.4vh, 84px); line-height: 1.05; transition: opacity .9s ease, transform .9s ease; }
  .title small { display: block; font-weight: 700; font-size: .5em; color: var(--muted); letter-spacing: 0; margin-top: .25em; }
  .title.hidden { opacity: 0; transform: translateY(-10px); }
  .title .tag { display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .3em; vertical-align: .12em; }
  #t-now .tag { background: var(--cream); box-shadow: 0 0 0 .08em var(--navy), 0 0 0 .14em var(--cream); }
  #t-future .tag { background: var(--navy-2); box-shadow: 0 0 0 .08em var(--cream); }

  .counter { text-align: right; }
  .counter .n { font-size: clamp(40px, 9vh, 140px); font-weight: 900; line-height: .95; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; color: var(--cream); transition: transform .3s; }
  .counter .n.bump { transform: scale(1.08); }
  .counter .lbl { font-size: clamp(14px, 2.4vh, 36px); color: var(--muted); font-weight: 800; }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #bubbles { transition: opacity .7s ease; }
  #bubbles.fading { opacity: 0; }
  .bubble { cursor: default; }
  .bubble text { text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .bubble .en { font-weight: 900; letter-spacing: -.01em; }
  .bubble .ko { font-weight: 700; opacity: .78; }
  .bubble .ct { font-weight: 900; letter-spacing: -.02em; }
  .badge text { font-weight: 900; fill: var(--cream); text-anchor: middle; dominant-baseline: central; letter-spacing: .14em; }

  #empty { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2; pointer-events: none;
    transition: opacity .8s ease; text-align: center; }
  #empty.hidden { opacity: 0; }
  #empty .big { font-size: clamp(36px, 8vh, 120px); font-weight: 900; letter-spacing: -.025em; color: var(--cream); }
  #empty .sub { font-size: clamp(20px, 4vh, 60px); color: var(--muted); font-weight: 800; margin-top: .4em; }
  #empty .dots { margin-top: 3vh; display: flex; gap: 1.6vw; justify-content: center; align-items: center; }
  #empty .dots span { width: 3vh; height: 3vh; border-radius: 50%; border: 2px solid var(--cream); animation: float 2.4s ease-in-out infinite; }
  #empty .dots span:nth-child(2) { width: 4.4vh; height: 4.4vh; background: var(--cream); box-shadow: 0 0 0 5px var(--navy), 0 0 0 7px var(--cream); animation-delay: .3s; }
  #empty .dots span:nth-child(3) { animation-delay: .6s; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.6vh) } }

  #qr { position: fixed; right: 2.4vw; bottom: 3vh; z-index: 4; background: var(--pearl); color: var(--navy); border-radius: 22px;
    padding: 16px 16px 12px; width: clamp(240px, 30vh, 380px); text-align: center;
    box-shadow: 0 0 0 6px var(--navy), 0 0 0 8px var(--cream);
    transition: opacity .6s ease, transform .6s ease; }
  #qr.hidden { opacity: 0; transform: translateY(20px) scale(.96); pointer-events: none; }
  #qr img { width: 100%; aspect-ratio: 1; display: block; border-radius: 10px; background: #fff; }
  #qr .scan { font-weight: 900; font-size: clamp(18px, 2.6vh, 30px); margin-top: 6px; letter-spacing: -.01em; color: var(--navy); }
  #qr .url { font-size: clamp(12px, 1.6vh, 20px); color: rgba(25, 40, 85, .7); font-weight: 800; word-break: break-all; margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="left">
  <div class="brand" aria-label="KAVE">KAVE</div>
  <div class="titles" aria-live="polite">
    <div class="title" id="t-now"><span class="tag"></span>Now · 지금 하는 일<small>What we do today</small></div>
    <div class="title hidden" id="t-future"><span class="tag"></span>Future · 꿈의 직업<small>What we dream of</small></div>
  </div>
  </div>
  <div class="counter">
    <div class="n" id="count">0</div>
    <div class="lbl">joined · 명 참여</div>
  </div>
</header>

<div id="stage"><svg id="svg" aria-label="Job bubble chart" role="img">
  <defs id="defs">
  </defs>
  <g id="bubbles"></g>
</svg></div>

<div id="empty" class="hidden">
  <div>
    <div class="big">Scan to join</div>
    <div class="sub">QR을 스캔하세요</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="qr">
  <img src="/qr.svg" alt="QR code to join">
  <div class="scan">Scan to join · 참여하기</div>
  <div class="url" id="url"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  'use strict';
  var MAX = 40, ROTATE_MS = 15000, REF = 100; // labels laid out at radius REF, then scaled

  // Brand-only ramp: flat fills, ink chosen for contrast, thin cream ring on navy tints
  var PALETTE = [
    { fill: '#FEF8DE', ink: '#192855', ring: 'none' },
    { fill: '#2E3F73', ink: '#FEF8DE', ring: '#FEF8DE' },
    { fill: '#F3E7B8', ink: '#192855', ring: 'none' },
    { fill: '#3B4C82', ink: '#FEF8DE', ring: '#FEF8DE' },
    { fill: '#F1F1F1', ink: '#192855', ring: 'none' },
    { fill: '#192855', ink: '#FEF8DE', ring: '#FEF8DE' }
  ];
  var TOP_STYLE = { fill: '#FEF8DE', ink: '#192855', ring: 'none' };
  function sty(d) { return d.top ? TOP_STYLE : PALETTE[d.hue]; }
  function hue(key) { var h = 0; for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0; return h % PALETTE.length; }

  var svg = d3.select('#svg'), layer = d3.select('#bubbles');
  var W = innerWidth, H = innerHeight;
  var stats = { total: 0, now: [], future: [] };
  var state = { qrVisible: true, mode: 'auto' };
  var shown = 'now';
  var nodes = [], byKey = new Map(), seq = 0;

  // ---------- counter count-up ----------
  var countEl = document.getElementById('count'), shownCount = 0, countRaf = 0;
  function setCount(n) {
    if (n === shownCount) return;
    var from = shownCount, t0 = performance.now(), dur = 1200;
    cancelAnimationFrame(countRaf);
    countEl.classList.add('bump'); setTimeout(function () { countEl.classList.remove('bump'); }, 300);
    (function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      countEl.textContent = Math.round(from + (n - from) * e).toLocaleString();
      if (p < 1) countRaf = requestAnimationFrame(step); else shownCount = n;
    })(t0);
  }

  // ---------- layout area (avoid header + QR corner) ----------
  function area() {
    var top = Math.min(H * 0.21, 240), qr = state.qrVisible ? Math.min(Math.max(240, H * 0.3), 380) + 60 : 0;
    var right = qr ? Math.min(qr, W * 0.32) : 0;
    var w = W - right - W * 0.04, h = H - top - H * 0.04;
    return { cx: W * 0.02 + w / 2, cy: top + h / 2, w: w, h: h };
  }
  function scaleRadii(list) {
    var a = area(), sum = d3.sum(list, function (d) { return d.count; }) || 1;
    var k = Math.sqrt((0.52 * a.w * a.h) / (Math.PI * sum));
    var maxR = Math.min(a.w, a.h) * 0.36;
    list.forEach(function (d) { d.tr = Math.max(14, Math.min(maxR, k * Math.sqrt(d.count))); });
  }

  // ---------- simulation ----------
  var sim = d3.forceSimulation()
    .velocityDecay(0.35)
    .force('x', d3.forceX().strength(0.035))
    .force('y', d3.forceY().strength(0.05))
    .force('collide', d3.forceCollide().radius(function (d) { return d.tr + 6 + (d.top ? Math.max(8, d.tr * 0.09) : 0); }).strength(0.9).iterations(3))
    .alphaTarget(0.02)
    .on('tick', tick);
  function center() {
    var a = area();
    sim.force('x').x(a.cx); sim.force('y').y(a.cy);
  }

  function tick() {
    var t = performance.now() / 1000, a = area();
    nodes.forEach(function (d) {
      d.r += (d.tr - d.r) * 0.08;
      // gentle drift so it never looks frozen
      d.vx += Math.sin(t * 0.6 + d.seed) * 0.03;
      d.vy += Math.cos(t * 0.5 + d.seed * 1.3) * 0.03;
      // keep inside area
      var minX = a.cx - a.w / 2 + d.r, maxX = a.cx + a.w / 2 - d.r;
      var minY = a.cy - a.h / 2 + d.r, maxY = a.cy + a.h / 2 - d.r;
      if (minX < maxX) d.x = Math.max(minX, Math.min(maxX, d.x));
      if (minY < maxY) d.y = Math.max(minY, Math.min(maxY, d.y));
    });
    layer.selectAll('g.bubble')
      .attr('transform', function (d) { return 'translate(' + d.x.toFixed(1) + ',' + d.y.toFixed(1) + ')'; });
    layer.selectAll('g.bubble circle.body').attr('r', function (d) { return Math.max(0, d.r); });
    layer.selectAll('g.bubble circle.halo').attr('r', function (d) { return Math.max(0, d.r + Math.max(6, d.r * 0.07)); })
      .attr('stroke-width', function (d) { return Math.max(3, d.r * 0.035); });
    layer.selectAll('g.bubble g.label').attr('transform', function (d) { return 'scale(' + (d.r / REF).toFixed(4) + ')'; });
    layer.selectAll('g.bubble g.badge').attr('transform', function (d) { return 'translate(0,' + (-d.r).toFixed(1) + ') scale(' + Math.max(0.6, Math.min(1.6, d.r / 120)).toFixed(3) + ')'; });
  }

  // ---------- label wrapping ----------
  function wrap2(s) {
    var words = String(s).split(/\s+/).filter(Boolean);
    if (words.length < 2 || s.length <= 12) return [s];
    var best = [s], bestDiff = Infinity;
    for (var i = 1; i < words.length; i++) {
      var a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      var diff = Math.max(a.length, b.length);
      if (diff < bestDiff) { bestDiff = diff; best = [a, b]; }
    }
    return best;
  }
  function titleCase(s) { return String(s).replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }

  function drawLabel(g, d) {
    g.selectAll('*').remove();
    if (d.tr < 34) return; // too small to read
    var lines = wrap2(titleCase(d.en));
    var longest = d3.max(lines, function (l) { return l.length; });
    // available width ~ 1.6*REF; char width ~ 0.58em
    var fs = Math.max(12, Math.min(38, (1.55 * REF) / (longest * 0.58)));
    var hasKo = d.ko && d.tr >= 55;
    var koFs = Math.min(26, fs * 0.62), ctFs = Math.min(40, fs * 0.95);
    var blockH = lines.length * fs * 1.05 + (hasKo ? koFs * 1.3 : 0) + ctFs * 1.2;
    var y = -blockH / 2 + fs * 0.55;
    lines.forEach(function (l) {
      g.append('text').attr('class', 'en').attr('y', y).attr('font-size', fs).text(l);
      y += fs * 1.05;
    });
    if (hasKo) { y += koFs * 0.15; g.append('text').attr('class', 'ko').attr('y', y).attr('font-size', koFs).text(d.ko); y += koFs * 1.15; }
    y += ctFs * 0.25;
    g.append('text').attr('class', 'ct').attr('y', y).attr('font-size', ctFs).text(d.count);
  }

  // ---------- render ----------
  function render(list) {
    list = list.slice(0, MAX).map(function (d) { return { key: d.key, en: d.en, ko: d.ko, count: d.count }; });
    scaleRadii(list);
    center();
    var a = area(), next = [];
    list.forEach(function (d, i) {
      var n = byKey.get(d.key);
      if (!n) {
        var ang = Math.random() * Math.PI * 2, rad = Math.random() * Math.min(a.w, a.h) * 0.25;
        n = { key: d.key, x: a.cx + Math.cos(ang) * rad, y: a.cy + Math.sin(ang) * rad, r: 0, vx: 0, vy: 0,
              seed: Math.random() * 10, hue: (hue(d.key) + (seq++)) % PALETTE.length, isNew: true };
        byKey.set(d.key, n);
      } else n.isNew = false;
      n.en = d.en; n.ko = d.ko; n.count = d.count; n.tr = d.tr; n.top = i === 0 && d.count > 0;
      next.push(n);
    });
    var keep = new Set(next.map(function (n) { return n.key; }));
    byKey.forEach(function (_, k) { if (!keep.has(k)) byKey.delete(k); });
    nodes = next;

    var sel = layer.selectAll('g.bubble').data(nodes, function (d) { return d.key; });
    sel.exit().transition().duration(500).style('opacity', 0).remove();
    var enter = sel.enter().append('g').attr('class', 'bubble');
    var inner = enter.append('g').attr('class', 'pop');
    inner.append('circle').attr('class', 'halo').attr('fill', 'none').attr('stroke', '#FEF8DE');
    inner.append('circle').attr('class', 'body');
    inner.append('g').attr('class', 'label');
    // spring pop-in
    inner.attr('transform', 'scale(0.2)').transition().duration(1400).ease(d3.easeElasticOut.amplitude(1).period(0.35))
      .attr('transform', 'scale(1)');

    var all = enter.merge(sel);
    all.select('circle.halo').style('display', function (d) { return d.top ? null : 'none'; });
    all.select('circle.body')
      .attr('fill', function (d) { return sty(d).fill; })
      .attr('stroke', function (d) { return sty(d).ring; })
      .attr('stroke-width', 2);
    all.select('g.label').attr('fill', function (d) { return sty(d).ink; })
      .each(function (d) { drawLabel(d3.select(this), d); });
    all.select('g.badge').remove();
    all.filter(function (d) { return d.top && d.tr >= 40; }).select('g.pop').append('g').attr('class', 'badge').call(function (b) {
      b.append('rect').attr('x', -40).attr('y', -16).attr('width', 80).attr('height', 32).attr('rx', 16)
        .attr('fill', '#192855').attr('stroke', '#FEF8DE').attr('stroke-width', 2);
      b.append('text').attr('x', 2).attr('y', 1).attr('font-size', 17).text('TOP');
    });
    all.order();
    all.filter(function (d) { return d.top; }).raise();
    // biggest last so it renders on top
    sim.nodes(nodes);
    sim.alpha(0.5).restart();
    tick();

    document.getElementById('empty').classList.toggle('hidden', nodes.length > 0);
  }

  // ---------- mode / title ----------
  function setShown(m, animate) {
    var changed = m !== shown;
    shown = m;
    document.getElementById('t-now').classList.toggle('hidden', m !== 'now');
    document.getElementById('t-future').classList.toggle('hidden', m !== 'future');
    if (!changed || !animate) { render(stats[shown] || []); return; }
    var g = document.getElementById('bubbles');
    g.classList.add('fading');
    setTimeout(function () {
      // fresh layout for the other list
      layer.selectAll('g.bubble').remove(); byKey.clear(); nodes = [];
      render(stats[shown] || []);
      g.classList.remove('fading');
    }, 700);
  }
  setInterval(function () {
    if (state.mode === 'auto') setShown(shown === 'now' ? 'future' : 'now', true);
  }, ROTATE_MS);

  // ---------- data ----------
  var socket = io();
  socket.on('stats', function (s) {
    stats = { total: s.total || 0, now: s.now || [], future: s.future || [] };
    setCount(stats.total);
    render(stats[shown] || []);
  });
  socket.on('state', function (s) {
    var qrChanged = s.qrVisible !== state.qrVisible;
    state = s;
    document.getElementById('qr').classList.toggle('hidden', !s.qrVisible);
    if (s.mode === 'now' || s.mode === 'future') setShown(s.mode, true);
    else if (qrChanged) render(stats[shown] || []);
  });
  fetch('/api/url').then(function (r) { return r.json(); }).then(function (j) {
    document.getElementById('url').textContent = String(j.url || '').replace(/^https?:\/\//, '').replace(/\/$/, '');
  }).catch(function () {});

  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { W = innerWidth; H = innerHeight; render(stats[shown] || []); }, 150);
  });
  render([]);
})();
</script>
</body>
</html>
