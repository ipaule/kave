<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#192855">
<title>KAVE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #192855; --cream: #FEF8DE; --pearl: #F1F1F1; --white: #ffffff;
    --navy-60: rgba(25,40,85,.6); --navy-20: rgba(25,40,85,.2); --navy-10: rgba(25,40,85,.08);
    --cream-60: rgba(254,248,222,.6); --cream-30: rgba(254,248,222,.3); --err: #C0392B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--pearl); color: var(--navy); font-family: 'Nunito', 'Noto Sans KR', system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
  h1 {
    position: relative; overflow: hidden;
    font-size: 1.5rem; font-weight: 900; letter-spacing: .06em; font-stretch: semi-condensed;
    margin: 0 0 14px; padding: 20px 18px; border-radius: 20px;
    background: var(--navy); color: var(--cream); display: flex; align-items: center; gap: 10px;
  }
  h1::after { content: ""; position: absolute; width: 130px; height: 130px; right: -40px; top: -55px; border-radius: 50%; border: 1.5px solid var(--cream-30); pointer-events: none; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 2px var(--navy), 0 0 0 3.5px var(--cream-60); flex: none; }
  .dot.on { background: var(--cream); }
  .card { background: var(--white); border: 1.5px solid var(--navy-10); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .label { font-size: .8rem; font-weight: 800; color: var(--navy-60); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .total { font-size: 3.4rem; font-weight: 900; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--navy); }
  .total small { font-size: 1rem; color: var(--navy-60); font-weight: 700; letter-spacing: 0; margin-left: 6px; }
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; user-select: none; }
  button:focus-visible, a.link:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .qr-btn { width: 100%; min-height: 56px; border-radius: 999px; font-size: 1.15rem; font-weight: 900; background: var(--navy); color: var(--cream); }
  .qr-btn.off { background: var(--cream); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }
  .qr-btn:disabled, .seg button:disabled { opacity: .6; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--navy); padding: 4px; border-radius: 999px; }
  .seg button { min-height: 48px; border-radius: 999px; background: transparent; color: var(--cream-60); font-weight: 800; font-size: 1rem; }
  .seg button[aria-pressed="true"] { background: var(--cream); color: var(--navy); font-weight: 900; }
  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: .9rem; background: var(--cream); }
  .top > div { min-width: 0; }
  .top ol { margin: 0; padding-left: 1.2em; color: var(--navy); font-weight: 700; }
  .top li { margin: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top li span { color: var(--navy-60); font-weight: 400; }
  a.link { display: block; text-align: center; color: var(--navy); background: transparent; border: 1.5px solid var(--navy-20); border-radius: 999px; padding: 14px; text-decoration: none; font-weight: 800; }
  #err { color: var(--err); font-size: .9rem; font-weight: 700; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1><span class="dot" id="conn" aria-hidden="true"></span>KAVE Admin</h1>

  <section class="card">
    <div class="label">Participants · 참여자</div>
    <div class="total"><span id="total">0</span><small>joined</small></div>
  </section>

  <section class="card">
    <div class="label">QR code on screen</div>
    <button class="qr-btn" id="qrBtn" type="button">Hide QR</button>
  </section>

  <section class="card">
    <div class="label">Screen mode</div>
    <div class="seg" role="group" aria-label="Screen mode">
      <button type="button" data-mode="auto" aria-pressed="false">Auto</button>
      <button type="button" data-mode="now" aria-pressed="false">Now</button>
      <button type="button" data-mode="future" aria-pressed="false">Future</button>
    </div>
  </section>

  <section class="card top">
    <div><div class="label">Top now</div><ol id="topNow"></ol></div>
    <div><div class="label">Top future</div><ol id="topFuture"></ol></div>
  </section>

  <div id="err" role="status"></div>
  <a class="link" href="/screen" target="_blank" rel="noopener">Open /screen ↗</a>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  'use strict';
  var state = { qrVisible: true, mode: 'auto' };
  var qrBtn = document.getElementById('qrBtn'), err = document.getElementById('err');
  var segBtns = Array.prototype.slice.call(document.querySelectorAll('.seg button'));

  function paint() {
    qrBtn.textContent = state.qrVisible ? 'Hide QR' : 'Show QR';
    qrBtn.classList.toggle('off', !state.qrVisible);
    segBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
  }
  function list(el, rows) {
    el.textContent = '';
    rows.slice(0, 5).forEach(function (r) {
      var li = document.createElement('li');
      li.textContent = r.en + ' ';
      var s = document.createElement('span'); s.textContent = '(' + r.count + ')';
      li.appendChild(s); el.appendChild(li);
    });
  }

  function post(body) {
    err.textContent = '';
    qrBtn.disabled = true; segBtns.forEach(function (b) { b.disabled = true; });
    return fetch('/api/admin/state', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 401) { location.reload(); throw new Error('PIN required'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (s) { state = s; paint(); })
      .catch(function (e) { err.textContent = 'Could not update: ' + e.message; })
      .finally(function () { qrBtn.disabled = false; segBtns.forEach(function (b) { b.disabled = false; }); });
  }

  qrBtn.addEventListener('click', function () { post({ qrVisible: !state.qrVisible }); });
  segBtns.forEach(function (b) { b.addEventListener('click', function () { post({ mode: b.dataset.mode }); }); });

  var socket = io(), conn = document.getElementById('conn');
  socket.on('connect', function () { conn.classList.add('on'); });
  socket.on('disconnect', function () { conn.classList.remove('on'); });
  socket.on('state', function (s) { state = s; paint(); });
  socket.on('stats', function (s) {
    document.getElementById('total').textContent = (s.total || 0).toLocaleString();
    list(document.getElementById('topNow'), s.now || []);
    list(document.getElementById('topFuture'), s.future || []);
  });
  paint();
})();
</script>
</body>
</html>
