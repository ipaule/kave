# Render Blueprint: New → Blueprint → pick this repo. Paste env values after first deploy.
services:
  - type: web
    name: kave
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PIN
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
